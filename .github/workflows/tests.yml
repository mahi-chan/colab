name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uvx ruff check src tests
      - run: uv run pytest -q

  # The installer has to work on a fresh computer of each kind, so run the real
  # install scripts there and check the result.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      THESIS_MCP_BRANCH: ${{ github.head_ref || github.ref_name }}
      THESIS_MCP_REPO_SLUG: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The one-line form: the script is piped in from outside any checkout, downloads the
      # project itself, and must leave a working `thesis-mcp` command behind.
      - name: One-line install (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$HOME/.cursor" "$HOME/.gemini"
          cd "$RUNNER_TEMP"
          cat "$GITHUB_WORKSPACE/install.sh" | sh
          "$HOME/.local/bin/thesis-mcp" clients | tee clients.txt
          grep -Eq "^cursor +yes +yes" clients.txt && grep -Eq "^gemini +yes +yes" clients.txt
          "$HOME/.local/bin/thesis-mcp" doctor
      - name: One-line install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cursor", "$env:USERPROFILE\.gemini" | Out-Null
          Set-Location $env:RUNNER_TEMP
          Get-Content "$env:GITHUB_WORKSPACE\install.ps1" -Raw | Invoke-Expression
          $shim = "$env:USERPROFILE\.local\bin\thesis-mcp.cmd"
          $clients = & $shim clients
          $clients
          if (-not ($clients -match "^cursor +yes +yes")) { throw "cursor is not installed" }
          if (-not ($clients -match "^gemini +yes +yes")) { throw "gemini is not installed" }
          & $shim doctor

      # From a checkout, with explicit clients.
      - name: Install from the checkout (macOS, Linux)
        if: runner.os != 'Windows'
        run: ./install.sh --client vscode --client codex --client claude-desktop
      - name: Install from the checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 --client vscode --client codex --client claude-desktop
      - name: Check every requested client is registered
        shell: bash
        run: |
          uv run --no-sync thesis-mcp clients | tee clients.txt
          for c in vscode codex claude-desktop; do
            grep -Eq "^$c +yes +yes" clients.txt || { echo "$c is not installed"; exit 1; }
          done
      - name: Installer and server tests
        run: |
          uv sync --locked
          uv run pytest -q tests/test_installer.py tests/test_smoke.py
