name: Desktop Release

# Builds the CircuitLab desktop app for Windows and Linux on native runners
# (no wine / no cross-compilation), then publishes the installers as a GitHub
# Release so the website's Download buttons resolve. Runs on a push to the
# working branch, on a version tag, or manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/electrical-components-simulator-gnytc5"
    # Only rebuild installers when app/desktop code changes — not for edits to
    # the landing page or docs.
    paths:
      - "src/**"
      - "app/**"
      - "electron/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/desktop-release.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Package desktop app (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: circuitlab-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: warn

  # Publish the installers as a GitHub Release. On a tag it uses that tag; on a
  # branch push it (re)publishes the rolling v0.1.0 release marked "latest", so
  # the website's releases/latest/download/... links always resolve. always() so
  # a hiccup on one platform still ships the other's installers.
  release:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'CircuitLab v0.1.0' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/**/*
          generate_release_notes: true
