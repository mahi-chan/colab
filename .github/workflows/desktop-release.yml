name: Desktop Release

# Builds the CircuitLab desktop app for Windows and Linux on native runners
# (no wine / no cross-compilation) and uploads the installers as artifacts.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/electrical-components-simulator-gnytc5"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Package desktop app (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: circuitlab-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: warn

  # When triggered by a version tag, publish the installers as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
