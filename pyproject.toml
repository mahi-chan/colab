[project]
name = "gpu-bridge"
version = "0.4.0"
description = "MCP server that runs ML work (RL, CV, LLM fine-tuning, competitions) on Google Colab, Kaggle and rented Hugging Face GPUs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "huggingface-hub>=2.4,<3",
    "kaggle>=2.2,<3",
    "matplotlib>=3.7",
    "mcp[cli]>=1.2.0,<2",
    "requests>=2.31",
    "six>=1.16",
    "websocket-client>=1.7",
]

[project.scripts]
gpu-bridge = "gpu_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_bridge"]

# The example scripts are served by the example_script tool, so they travel with the package.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "gpu_bridge/_assets/examples"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter-server>=2.14",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F", "B"]
