[project]
name = "thesis-mcp"
version = "0.1.0"
description = "MCP server that drives a Google Colab / Kaggle runtime for ML thesis work (reinforcement learning & computer vision)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31",
    "websocket-client>=1.7",
]

[project.scripts]
thesis-mcp = "thesis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
