[project]
name = "thesis-mcp"
version = "0.3.0"
description = "MCP server that runs ML work (RL, CV, LLM fine-tuning, competitions) on Google Colab, Kaggle and rented Hugging Face GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "huggingface-hub>=2.4,<3",
    "matplotlib>=3.7",
    "mcp[cli]>=1.2.0,<2",
    "requests>=2.31",
    "websocket-client>=1.7",
]

[project.scripts]
thesis-mcp = "thesis_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_mcp"]

# The notebook cells and example scripts are served by the setup_guide / example_script
# tools, so they must travel with the package.
[tool.hatch.build.targets.wheel.force-include]
"runtime" = "thesis_mcp/_assets/runtime"
"examples" = "thesis_mcp/_assets/examples"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter-server>=2.14",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F", "B"]
